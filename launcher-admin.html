<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Launcher Unlock Codes</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --dim:#94a3b8; --acc:#3b82f6; --gold:#eab308; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { color: var(--dim); margin: 0 0 20px; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    label { display:block; font-size: 13px; color: var(--dim); margin: 10px 0 4px; }
    input { width:100%; padding: 11px 12px; border-radius: 10px; border:1px solid var(--line); background:#0b1222; color:var(--text); font-size:15px; }
    button { margin-top: 14px; padding: 11px 16px; border:0; border-radius:10px; background:var(--acc); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
    button.ghost { background: transparent; border:1px solid var(--line); color: var(--dim); margin-top: 0; }
    .err { color: var(--err); font-size: 14px; min-height: 18px; margin-top: 8px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 12px 0; border-top:1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row .name { font-weight: 600; }
    .row .meta { color: var(--dim); font-size: 12px; }
    .code { font-family: ui-monospace, Consolas, monospace; font-size: 40px; letter-spacing: 6px; color: var(--gold); text-align:center; margin: 8px 0 4px; }
    .timer { text-align:center; color: var(--dim); font-size: 13px; }
    .hidden { display:none; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Launcher unlock codes</h1>
      <p class="sub">Codes for the flip-phone launcher's admin screen. Each code works for one phone for 10 minutes.</p>
    </div>
    <button id="logout" class="ghost hidden">Log out</button>
  </div>

  <section id="login" class="card">
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="login-error" class="err"></div>
    </form>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <label for="device">Device ID (shown on the phone's unlock screen)</label>
      <input id="device" placeholder="e.g. 558800117696" autocomplete="off">
      <button id="get">Show code</button>
      <div id="code-box" class="hidden">
        <div id="code" class="code"></div>
        <div id="timer" class="timer"></div>
      </div>
      <div id="app-error" class="err"></div>
    </div>

    <div class="card">
      <div class="top"><strong>Phones</strong><button id="refresh" class="ghost">Refresh</button></div>
      <div id="devices"><p class="sub">No phones yet. A phone appears here after its first unlock attempt.</p></div>
    </div>
  </section>
</main>

<script type="module">
  import { supabase } from './supabase-client.js';

  const $ = (id) => document.getElementById(id);
  let timerHandle = null;

  async function token() {
    const { data: { session } } = await supabase.auth.getSession();
    return session?.access_token || null;
  }

  async function api(path) {
    const t = await token();
    const res = await fetch(path, { headers: { Authorization: `Bearer ${t}` }, cache: 'no-store' });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) throw new Error('Access denied: you are not an authorized admin.');
    if (!res.ok) throw new Error(body.error || `Error ${res.status}`);
    return body;
  }

  async function showApp() {
    try {
      await loadDevices();
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('logout').classList.remove('hidden');
    } catch (e) {
      await supabase.auth.signOut();
      $('login-error').textContent = e.message;
    }
  }

  async function loadDevices() {
    const { devices } = await api('/api/launcher/code');
    const box = $('devices');
    if (!devices.length) return;
    box.innerHTML = '';
    for (const d of devices) {
      const row = document.createElement('div');
      row.className = 'row';
      const info = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = d.label || d.model || 'Phone';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${d.device_id} · last seen ${new Date(d.last_seen).toLocaleString()}`;
      info.append(name, meta);
      const btn = document.createElement('button');
      btn.textContent = 'Code';
      btn.style.marginTop = '0';
      btn.onclick = () => { $('device').value = d.device_id; getCode(); };
      row.append(info, btn);
      box.append(row);
    }
  }

  async function getCode() {
    $('app-error').textContent = '';
    const device = $('device').value.trim();
    if (!device) { $('app-error').textContent = 'Enter the device ID.'; return; }
    try {
      const { code, secondsLeft } = await api(`/api/launcher/code?device=${encodeURIComponent(device)}`);
      $('code').textContent = code.replace(/(\d{4})(\d{4})/, '$1 $2');
      $('code-box').classList.remove('hidden');
      let left = secondsLeft;
      clearInterval(timerHandle);
      const tick = () => {
        if (left <= 0) { clearInterval(timerHandle); getCode(); return; }
        $('timer').textContent = `New code in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} (previous code still accepted 10 more minutes)`;
        left--;
      };
      tick();
      timerHandle = setInterval(tick, 1000);
    } catch (e) {
      $('app-error').textContent = e.message;
    }
  }

  $('login-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('login-error').textContent = '';
    const { error } = await supabase.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
    if (error) { $('login-error').textContent = error.message; return; }
    showApp();
  });
  $('get').onclick = getCode;
  $('device').addEventListener('keydown', (e) => { if (e.key === 'Enter') getCode(); });
  $('refresh').onclick = () => loadDevices().catch((e) => { $('app-error').textContent = e.message; });
  $('logout').onclick = async () => { await supabase.auth.signOut(); location.reload(); };

  (async () => { if (await token()) showApp(); })();
</script>
</body>
</html>
